name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

# npm Trusted Publishing (OIDC): the job authenticates to npmjs with a short-lived
# OIDC token instead of a long-lived NPM_TOKEN secret. Requires the package's
# npmjs settings to list this repo + workflow as a Trusted Publisher.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm 11.5.1+ (node 22 ships an older npm).
      # No install step: the plugin is published as source (no build, no scripts),
      # so neither the version check nor npm publish needs node_modules.
      - name: Update npm
        run: npm install -g npm@latest

      # Publish only when package.json carries a version the registry doesn't
      # have yet — robust regardless of which commit bumped the version.
      - name: Check if the version is unpublished
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "$NAME" version 2>/dev/null || echo "none")
          echo "Local: $LOCAL, published: $PUBLISHED"
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.check.outputs.changed == 'true'
        run: npm publish --access public
